name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespass
          POSTGRES_DB: SAAS_BILLING_TEST
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Schema to Test DB
        env:
          DATABASE_URL: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
        run: npx prisma db push

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm run test:e2e
