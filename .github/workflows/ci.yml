name: CI/CD Pipeline & Production Readiness

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  lint-and-test:
    name: Lint, Unit & E2E Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespass
          POSTGRES_DB: SAAS_BILLING_TEST
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck & Build NestJS App
        run: npm run build

      - name: Run Unit Tests
        run: npm test

      - name: Deploy Prisma Migrations to Test DB
        env:
          DATABASE_URL: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
        run: npx prisma migrate deploy

      - name: Run Database Seeding Test
        env:
          DATABASE_URL: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
        run: npm run db:seed

      - name: Run End-to-End (E2E) Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgrespass@localhost:5432/SAAS_BILLING_TEST?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-key-for-ci-pipeline-execution-1234
        run: npm run test:e2e

  docker-build:
    name: Production Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cms-api:ci-test
